<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (() => {
        try {
          const savedTheme = localStorage.getItem("homeops-theme");
          document.documentElement.dataset.theme = savedTheme === "light" ? "light" : "dark";
        } catch {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
    <meta name="theme-color" content="#0d2017" />
    <meta name="description" content="HomeOps property operations workspace for bills, maintenance, documents, financing, receipts, and long-term ownership records." />
    <title>HomeOps · Property Operations</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
